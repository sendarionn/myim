name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          swift test
          python3 -m unittest discover -s Tests/ScriptTests -p 'test_*.py'

      - name: Build universal app
        env:
          MYIM_ARCHITECTURES: arm64 x86_64
        run: ./Scripts/build-macos-ime.sh

      - name: Verify app bundle
        run: |
          file .build/myim.app/Contents/MacOS/myim | grep arm64
          file .build/myim.app/Contents/MacOS/myim | grep x86_64
          file .build/myim.app/Contents/Helpers/myim-external-browser.app/Contents/MacOS/myim-external-browser | grep arm64
          file .build/myim.app/Contents/Helpers/myim-external-browser.app/Contents/MacOS/myim-external-browser | grep x86_64
          codesign --verify --deep --strict --verbose=2 .build/myim.app
